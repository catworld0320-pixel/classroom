<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>GPS Speed Camera</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 원래 기본 카메라 뷰 (화각 및 확대 이슈 없음) */
    #camera {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* 속도계 오버레이 */
    .speed-container {
      position: absolute;
      top: max(20px, env(safe-area-inset-top));
      left: max(20px, env(safe-area-inset-left));
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      pointer-events: none;
    }

    .speed-text {
      font-size: clamp(60px, 18vw, 100px);
      font-weight: 900;
      color: #000000;
      line-height: 0.9;
      letter-spacing: -2px;
      -webkit-text-stroke: 2.5px #ffffff;
      text-shadow: 
        0 0 4px #ffffff,
        0 0 8px rgba(0, 0, 0, 0.5);
    }

    .unit-text {
      font-size: clamp(20px, 5vw, 30px);
      font-weight: 800;
      color: #000000;
      margin-top: 4px;
      margin-left: 2px;
      -webkit-text-stroke: 1px #ffffff;
      text-shadow: 0 0 3px #ffffff;
    }

    .error-overlay {
      position: absolute;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .error-card {
      background: #1c1c1e;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 24px 20px;
      max-width: 340px;
      width: 100%;
      text-align: center;
      color: #ffffff;
    }

    .error-card h2 {
      font-size: 20px;
      color: #ff453a;
      margin-bottom: 12px;
    }

    .error-card p {
      font-size: 14px;
      line-height: 1.5;
      color: #d1d1d6;
      margin-bottom: 20px;
      word-break: keep-all;
    }

    .reload-btn {
      appearance: none;
      border: none;
      background-color: #0a84ff;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <video id="camera" autoplay muted playsinline></video>

  <div class="speed-container">
    <div id="speed" class="speed-text">--</div>
    <div class="unit-text">km/h</div>
  </div>

  <div id="errorOverlay" class="error-overlay hidden">
    <div class="error-card">
      <h2 id="errorTitle">권한 필요</h2>
      <p id="errorMessage">위치 및 카메라 권한을 허용해 주세요.</p>
      <button class="reload-btn" onclick="location.reload()">권한 변경 후 새로고침</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('camera');
    const speedEl = document.getElementById('speed');
    const errorOverlay = document.getElementById('errorOverlay');
    const errorTitle = document.getElementById('errorTitle');
    const errorMessage = document.getElementById('errorMessage');

    let watchId = null;
    let lastPosition = null;

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

      return R * c;
    }

    // 마이크(audio: false) 권한을 요청하지 않음으로써 통화모드 버그 차단
    async function initCamera() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('이 브라우저는 카메라 접근을 지원하지 않거나 HTTPS 연결이 아닙니다.');
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: { ideal: 'environment' } }
        });
        
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        showError('카메라 오류', getCameraErrorMessage(err));
      }
    }

    function initLocation() {
      if (!navigator.geolocation) {
        showError('GPS 오류', '이 브라우저는 위치 서비스를 지원하지 않습니다.');
        return;
      }

      watchId = navigator.geolocation.watchPosition(
        (position) => {
          const { latitude, longitude, speed } = position.coords;
          const timestamp = position.timestamp || Date.now();
          let calculatedKmh = 0;

          if (speed !== null && !isNaN(speed) && speed >= 0) {
            calculatedKmh = speed * 3.6;
          } else if (lastPosition) {
            const timeDiff = (timestamp - lastPosition.timestamp) / 1000;
            if (timeDiff > 0.1) {
              const distance = getDistanceMeters(lastPosition.latitude, lastPosition.longitude, latitude, longitude);
              calculatedKmh = (distance / timeDiff) * 3.6;
            }
          }

          lastPosition = { latitude, longitude, timestamp };
          const currentKmh = calculatedKmh < 3 ? 0 : Math.round(calculatedKmh);
          speedEl.textContent = currentKmh;
        },
        (err) => {
          if (err.code === err.PERMISSION_DENIED) {
            showError('위치 권한 거부', 'Safari 설정에서 위치 접근을 허용해 주세요.');
          } else {
            speedEl.textContent = '--';
          }
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
      );
    }

    function getCameraErrorMessage(err) {
      if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
        return '카메라 권한이 거부되었습니다. Safari 설정에서 권한을 허용해 주세요.';
      }
      return '카메라를 시작할 수 없습니다. HTTPS 접속 여부를 확인해 주세요.';
    }

    function showError(title, message) {
      errorTitle.textContent = title;
      errorMessage.textContent = message;
      errorOverlay.classList.remove('hidden');
    }

    window.addEventListener('DOMContentLoaded', () => {
      initCamera();
      initLocation();
    });

    window.addEventListener('pagehide', () => {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }
    });
  </script>
</body>
</html>
