<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Riding GPS Recorder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    #hiddenVideo {
      display: none;
    }

    /* 화면 전체 캔버스 (확대 없이 화면에 맞춤) */
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* 하단 컨트롤 영역 (버튼 및 녹화 타이머) */
    .controls {
      position: absolute;
      bottom: max(35px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shutter-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .shutter-btn {
      appearance: none;
      border: none;
      background: transparent;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
    }

    .shutter-inner {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background-color: #ffffff;
      transition: all 0.2s ease;
    }

    /* 녹화 중 버튼 스타일 */
    .shutter-btn.recording {
      border-color: rgba(255, 255, 255, 0.8);
    }

    .shutter-btn.recording .shutter-inner {
      background-color: #ff3b30;
      border-radius: 12px;
      width: 32px;
      height: 32px;
      animation: pulse 1.5s infinite;
    }

    /* 녹화 시간 타이머 (버튼 오른쪽에 배치) */
    .timer-text {
      position: absolute;
      left: 90px;
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
      pointer-events: none;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(0.9); }
      100% { transform: scale(1); }
    }

    /* 에러 모달 */
    .error-overlay {
      position: absolute;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .error-card {
      background: #1c1c1e;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 24px 20px;
      max-width: 340px;
      width: 100%;
      text-align: center;
      color: #ffffff;
    }

    .error-card h2 {
      font-size: 20px;
      color: #ff453a;
      margin-bottom: 12px;
    }

    .error-card p {
      font-size: 14px;
      line-height: 1.5;
      color: #d1d1d6;
      margin-bottom: 20px;
      word-break: keep-all;
    }

    .reload-btn {
      appearance: none;
      border: none;
      background-color: #0a84ff;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <video id="hiddenVideo" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>

  <!-- 녹화 버튼 & 시간 표시 -->
  <div class="controls">
    <div class="shutter-wrapper">
      <button id="shutterBtn" class="shutter-btn" aria-label="녹화 시작/중지">
        <div class="shutter-inner"></div>
      </button>
      <div id="timer" class="timer-text hidden">00:00</div>
    </div>
  </div>

  <div id="errorOverlay" class="error-overlay hidden">
    <div class="error-card">
      <h2 id="errorTitle">권한 필요</h2>
      <p id="errorMessage">위치, 카메라 및 마이크 권한을 모두 허용해 주세요.</p>
      <button class="reload-btn" onclick="location.reload()">권한 변경 후 새로고침</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('hiddenVideo');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const shutterBtn = document.getElementById('shutterBtn');
    const timerEl = document.getElementById('timer');
    const errorOverlay = document.getElementById('errorOverlay');

    let currentSpeedKmh = 0;
    let lastPosition = null;
    let watchId = null;

    let mediaStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    let recordStartTime = 0;
    let timerInterval = null;

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

      return R * c;
    }

    // 기본 화각(확대 방지) 및 주변 음 원음 수음 설정
    async function initMedia() {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' }
            // 비디오 확대 방지를 위해 과도한 resolution 픽셀 제한 제거
          },
          audio: {
            echoCancellation: false,  // 주변음 필터링 끄기
            noiseSuppression: false,  // 소음 억제 끄기 (자연스러운 주변 소리 수음)
            autoGainControl: false    // 음량 자동 조절 끄기
          }
        });

        video.srcObject = mediaStream;
        await video.play();

        resizeCanvas();
        requestAnimationFrame(drawCanvas);
      } catch (err) {
        showError('장치 접근 실패', '카메라 또는 마이크 권한이 거부되었거나 HTTPS 접속이 아닙니다.');
      }
    }

    function initGPS() {
      if (!navigator.geolocation) return;

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, speed } = pos.coords;
          const timestamp = pos.timestamp || Date.now();

          let calculatedKmh = 0;

          if (speed !== null && !isNaN(speed) && speed >= 0) {
            calculatedKmh = speed * 3.6;
          } else if (lastPosition) {
            const timeDiff = (timestamp - lastPosition.timestamp) / 1000;
            if (timeDiff > 0.1) {
              const distance = getDistanceMeters(lastPosition.latitude, lastPosition.longitude, latitude, longitude);
              calculatedKmh = (distance / timeDiff) * 3.6;
            }
          }

          lastPosition = { latitude, longitude, timestamp };
          currentSpeedKmh = calculatedKmh < 3 ? 0 : Math.round(calculatedKmh);
        },
        (err) => {
          if (err.code === err.PERMISSION_DENIED) {
            showError('위치 권한 거부', 'Safari 설정에서 위치 권한을 허용해 주세요.');
          }
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
      );
    }

    // Canvas 렌더링 (비디오 왜곡 및 크롭 최소화 적용)
    function drawCanvas() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        // 비디오 원래 비율을 유지하며 Canvas 크기에 맞춤
        const vWidth = video.videoWidth;
        const vHeight = video.videoHeight;
        const cWidth = canvas.width;
        const cHeight = canvas.height;

        const vAspect = vWidth / vHeight;
        const cAspect = cWidth / cHeight;

        let renderW, renderH, offsetX, offsetY;

        if (cAspect > vAspect) {
          renderW = cWidth;
          renderH = cWidth / vAspect;
          offsetX = 0;
          offsetY = (cHeight - renderH) / 2;
        } else {
          renderW = cHeight * vAspect;
          renderH = cHeight;
          offsetX = (cWidth - renderW) / 2;
          offsetY = 0;
        }

        ctx.clearRect(0, 0, cWidth, cHeight);
        ctx.drawImage(video, offsetX, offsetY, renderW, renderH);

        // 속도계 렌더링 (숫자 아래 km/h)
        const speedStr = isNaN(currentSpeedKmh) ? '--' : String(currentSpeedKmh);
        const unitStr = 'km/h';

        ctx.save();
        const startX = 35;
        const startY = 55;

        ctx.font = '900 85px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';

        ctx.lineWidth = 6;
        ctx.strokeStyle = '#ffffff';
        ctx.strokeText(speedStr, startX, startY);

        ctx.fillStyle = '#000000';
        ctx.fillText(speedStr, startX, startY);

        ctx.font = '800 24px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif';
        ctx.lineWidth = 3;
        ctx.strokeText(unitStr, startX + 4, startY + 92);
        ctx.fillText(unitStr, startX + 4, startY + 92);

        ctx.restore();
      }

      requestAnimationFrame(drawCanvas);
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.scale(dpr, dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
    }

    // 타이머 갱신 (00:00 형식)
    function startTimer() {
      recordStartTime = Date.now();
      timerEl.textContent = '00:00';
      timerEl.classList.remove('hidden');

      timerInterval = setInterval(() => {
        const elapsedSeconds = Math.floor((Date.now() - recordStartTime) / 1000);
        const mins = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
        const secs = String(elapsedSeconds % 60).padStart(2, '0');
        timerEl.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerEl.classList.add('hidden');
    }

    function setupRecorder() {
      const canvasStream = canvas.captureStream(30);
      const audioTrack = mediaStream.getAudioTracks()[0];
      
      if (audioTrack) {
        canvasStream.addTrack(audioTrack);
      }

      const options = MediaRecorder.isTypeSupported('video/mp4') 
        ? { mimeType: 'video/mp4', videoBitsPerSecond: 6000000 } 
        : { mimeType: 'video/webm', videoBitsPerSecond: 6000000 };

      try {
        mediaRecorder = new MediaRecorder(canvasStream, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(canvasStream);
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        stopTimer();

        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/mp4' });
        recordedChunks = [];

        const fileExtension = mediaRecorder.mimeType && mediaRecorder.mimeType.includes('webm') ? 'webm' : 'mp4';
        const file = new File([blob], `riding_${Date.now()}.${fileExtension}`, { type: blob.type });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: '라이딩 영상',
              text: 'GPS 속도계가 포함된 라이딩 영상입니다.'
            });
            return;
          } catch (err) {
            if (err.name === 'AbortError') return;
          }
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `riding_record_${Date.now()}.${fileExtension}`;
        a.click();
      };
    }

    shutterBtn.addEventListener('click', () => {
      if (!isRecording) {
        if (!mediaRecorder) setupRecorder();
        recordedChunks = [];
        mediaRecorder.start();
        isRecording = true;
        shutterBtn.classList.add('recording');
        startTimer();
      } else {
        mediaRecorder.stop();
        isRecording = false;
        shutterBtn.classList.remove('recording');
      }
    });

    function showError(title, message) {
      document.getElementById('errorTitle').textContent = title;
      document.getElementById('errorMessage').textContent = message;
      errorOverlay.classList.remove('hidden');
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('DOMContentLoaded', () => {
      initMedia();
      initGPS();
    });

    window.addEventListener('pagehide', () => {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
    });
  </script>
</body>
</html>
