<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>GPS Speed Camera</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #08090b; color: #fff; }
    body { min-height: 100dvh; }
    .app { position: relative; width: 100%; height: 100dvh; min-height: 100%; overflow: hidden; background: #08090b; }
    #camera {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; background: #111; z-index: 0;
    }
    .shade {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(180deg, rgba(0,0,0,.42), transparent 27%, transparent 68%, rgba(0,0,0,.42));
    }
    .speed-card {
      position: absolute; z-index: 2; top: max(18px, env(safe-area-inset-top));
      left: max(16px, env(safe-area-inset-left));
      min-width: 132px; padding: 12px 16px 11px;
      border: 1px solid rgba(255,255,255,.18); border-radius: 15px;
      background: rgba(0,0,0,.58); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 30px rgba(0,0,0,.18);
    }
    .speed-line { display: flex; align-items: baseline; gap: 7px; line-height: 1; }
    #speed { font-size: clamp(42px, 12vw, 58px); font-weight: 750; letter-spacing: -2.5px; font-variant-numeric: tabular-nums; }
    .unit { font-size: 15px; font-weight: 650; color: rgba(255,255,255,.88); }
    .caption { margin-top: 7px; font-size: 9px; letter-spacing: 1.7px; color: rgba(255,255,255,.67); font-weight: 700; }
    .status {
      position: absolute; z-index: 2; top: max(24px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right)); display: flex; align-items: center; gap: 7px;
      padding: 9px 12px; border-radius: 999px; background: rgba(0,0,0,.48);
      font-size: 11px; color: rgba(255,255,255,.9); backdrop-filter: blur(10px);
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #f04444; box-shadow: 0 0 10px #f04444; }
    .bottom {
      position: absolute; z-index: 2; left: 0; right: 0; bottom: max(22px, env(safe-area-inset-bottom));
      display: flex; justify-content: center; padding: 0 18px;
    }
    .hint {
      max-width: 440px; padding: 11px 15px; border-radius: 12px; text-align: center;
      background: rgba(0,0,0,.58); border: 1px solid rgba(255,255,255,.14);
      color: rgba(255,255,255,.85); font-size: 12px; line-height: 1.5;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .panel {
      position: absolute; z-index: 4; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: rgba(5,6,8,.92); backdrop-filter: blur(18px);
    }
    .panel-card { width: min(100%, 390px); text-align: center; }
    .logo { width: 62px; height: 62px; margin: 0 auto 20px; border: 1px solid rgba(255,255,255,.18);
      border-radius: 19px; display: grid; place-items: center; background: #17191d; font-size: 28px; }
    h1 { margin: 0 0 10px; font-size: 25px; letter-spacing: -.7px; }
    .desc { color: #a6a9b0; font-size: 14px; line-height: 1.65; margin: 0 0 22px; }
    button {
      appearance: none; border: 0; border-radius: 14px; padding: 15px 20px; width: 100%;
      color: #fff; background: #fff; color: #111; font-size: 15px; font-weight: 750; cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }
    .error { min-height: 20px; margin-top: 14px; color: #ff9b9b; font-size: 12px; line-height: 1.5; }
    .hidden { display: none !important; }
    .permission-note { margin-top: 17px; color: #777d87; font-size: 11px; line-height: 1.55; }
    @media (orientation: landscape) {
      .speed-card { top: max(12px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); }
      .status { top: max(16px, env(safe-area-inset-top)); }
      .bottom { bottom: max(12px, env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <main class="app">
    <video id="camera" autoplay muted playsinline></video>
    <div class="shade"></div>

    <section class="speed-card" aria-live="off" aria-label="현재 GPS 속도">
      <div class="speed-line"><span id="speed">--</span><span class="unit">km/h</span></div>
      <div class="caption">GPS SPEED · LIVE</div>
    </section>

    <div class="status"><span class="dot"></span><span id="statusText">연결 대기 중</span></div>

    <div class="bottom">
      <div class="hint" id="hint">카메라와 위치 권한을 허용하면 실시간 속도가 표시됩니다.</div>
    </div>

    <section class="panel" id="startPanel">
      <div class="panel-card">
        <div class="logo">◉</div>
        <h1>GPS Speed Camera</h1>
        <p class="desc">후면 카메라를 켜고 현재 이동 속도를 화면 왼쪽 위에 표시합니다.<br>화면 녹화를 시작하면 속도계도 영상에 함께 기록됩니다.</p>
        <button id="startButton">카메라 및 GPS 시작</button>
        <div class="error" id="error" role="alert"></div>
        <div class="permission-note">HTTPS 연결이 필요합니다. 촬영은 아이폰 제어센터의 '화면 기록'을 이용하세요.</div>
      </div>
    </section>
  </main>

  <script>
    const video = document.getElementById('camera');
    const speedEl = document.getElementById('speed');
    const statusText = document.getElementById('statusText');
    const hint = document.getElementById('hint');
    const startPanel = document.getElementById('startPanel');
    const startButton = document.getElementById('startButton');
    const errorEl = document.getElementById('error');

    let watchId = null;
    let latestSpeed = null;
    let lastPosition = null;
    let wakeLock = null;
    let cameraStream = null;

    function haversineMeters(a, b) {
      const toRad = v => v * Math.PI / 180;
      const lat1 = toRad(a.latitude), lat2 = toRad(b.latitude);
      const dLat = toRad(b.latitude - a.latitude);
      const dLon = toRad(b.longitude - a.longitude);
      const x = Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
      return 6371000 * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
    }

    function onPosition(position) {
      const c = position.coords;
      const now = position.timestamp || Date.now();
      let metersPerSecond = Number.isFinite(c.speed) && c.speed >= 0 ? c.speed : null;

      // 일부 브라우저에서 GPS speed가 제공되지 않을 때 좌표 차이로 계산
      if (metersPerSecond === null && lastPosition) {
        const seconds = (now - lastPosition.time) / 1000;
        if (seconds > 0.25 && seconds < 15) {
          const distance = haversineMeters(lastPosition, {
            latitude: c.latitude, longitude: c.longitude
          });
          metersPerSecond = distance / seconds;
        }
      }

      lastPosition = { latitude: c.latitude, longitude: c.longitude, time: now };

      // 위치 정확도가 지나치게 낮으면 숫자를 확정하지 않음
      if (Number.isFinite(c.accuracy) && c.accuracy > 100) {
        statusText.textContent = 'GPS 정확도 낮음';
        return;
      }

      if (metersPerSecond !== null && Number.isFinite(metersPerSecond)) {
        // 순간적인 GPS 튐 완화를 위한 비정상 속도 제외
        const kmh = Math.max(0, metersPerSecond * 3.6);
        if (kmh <= 250) latestSpeed = kmh;
      }
      statusText.textContent = 'GPS 연결됨';
    }

    function onPositionError(err) {
      statusText.textContent = 'GPS 연결 오류';
      hint.textContent = err.code === 1
        ? '위치 권한이 거부되었습니다. Safari 설정에서 위치 접근을 허용해 주세요.'
        : 'GPS 신호를 받지 못하고 있습니다. 하늘이 잘 보이는 곳에서 기다려 주세요.';
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      } catch (_) {}
    }

    async function start() {
      startButton.disabled = true;
      startButton.textContent = '연결 중...';
      errorEl.textContent = '';

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('이 브라우저에서 카메라를 사용할 수 없습니다. HTTPS 주소로 접속했는지 확인해 주세요.');
      }
      if (!navigator.geolocation) {
        throw new Error('이 브라우저에서 위치 기능을 사용할 수 없습니다.');
      }

      // 카메라 시작
      cameraStream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      });
      video.srcObject = cameraStream;
      await video.play();

      // 실시간 위치 감시 시작
      watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 20000
      });

      startPanel.classList.add('hidden');
      hint.textContent = '화면 녹화는 제어센터에서 시작하세요. 속도는 0.5초마다 갱신됩니다.';
      await requestWakeLock();
    }

    startButton.addEventListener('click', async () => {
      try {
        await start();
      } catch (err) {
        errorEl.textContent = err && err.message ? err.message : '시작하지 못했습니다. 권한을 확인해 주세요.';
        startButton.disabled = false;
        startButton.textContent = '다시 시도';
        if (cameraStream) cameraStream.getTracks().forEach(track => track.stop());
      }
    });

    // 표시값은 0.5초마다 갱신. 소수점 없이 반올림해 표시
    setInterval(() => {
      if (latestSpeed === null) {
        speedEl.textContent = '--';
      } else {
        speedEl.textContent = String(Math.round(latestSpeed));
      }
    }, 500);

    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible' && cameraStream && !wakeLock) {
        await requestWakeLock();
      }
    });

    window.addEventListener('pagehide', () => {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      if (cameraStream) cameraStream.getTracks().forEach(track => track.stop());
      if (wakeLock) wakeLock.release();
    });
  </script>
</body>
</html>
