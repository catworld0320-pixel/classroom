<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- Safari 상하단 여백 및 뷰포트 맞춤 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>GPS Speed Camera</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* 전체 화면 여백 제거 */
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 전체 화면 카메라 비디오 */
    #camera {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* 속도계 오버레이 영역 */
    .speed-container {
      position: absolute;
      top: max(20px, env(safe-area-inset-top));
      left: max(20px, env(safe-area-inset-left));
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      pointer-events: none;
    }

    /* 검정색 글씨 + 하얀색 외곽선 속도 숫자 */
    .speed-text {
      font-size: clamp(60px, 18vw, 100px);
      font-weight: 900;
      color: #000000;
      line-height: 0.9;
      letter-spacing: -2px;
      /* 하얀색 외곽선 효과 */
      -webkit-text-stroke: 2.5px #ffffff;
      text-shadow: 
        0 0 4px #ffffff,
        0 0 8px rgba(0, 0, 0, 0.5);
    }

    /* 하단 km/h 단위 표시 */
    .unit-text {
      font-size: clamp(20px, 5vw, 30px);
      font-weight: 800;
      color: #000000;
      margin-top: 4px;
      margin-left: 2px;
      -webkit-text-stroke: 1px #ffffff;
      text-shadow: 0 0 3px #ffffff;
    }

    /* 오류 / 권한 안내 레이어 */
    .error-overlay {
      position: absolute;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .error-card {
      background: #1c1c1e;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 24px 20px;
      max-width: 340px;
      width: 100%;
      text-align: center;
      color: #ffffff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .error-card h2 {
      font-size: 20px;
      color: #ff453a;
      margin-bottom: 12px;
    }

    .error-card p {
      font-size: 14px;
      line-height: 1.5;
      color: #d1d1d6;
      margin-bottom: 20px;
      word-break: keep-all;
    }

    .reload-btn {
      appearance: none;
      border: none;
      background-color: #0a84ff;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- 카메라 비디오 화면 -->
  <video id="camera" autoplay muted playsinline></video>

  <!-- 속도 표시 (검정 글씨 + 하얀 외곽선) -->
  <div class="speed-container">
    <div id="speed" class="speed-text">--</div>
    <div class="unit-text">km/h</div>
  </div>

  <!-- 권한 및 에러 안내 모달 (기본 숨김) -->
  <div id="errorOverlay" class="error-overlay hidden">
    <div class="error-card">
      <h2 id="errorTitle">권한 필요</h2>
      <p id="errorMessage">위치 및 카메라 권한을 허용해 주세요.</p>
      <button class="reload-btn" onclick="location.reload()">권한 변경 후 새로고침</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('camera');
    const speedEl = document.getElementById('speed');
    const errorOverlay = document.getElementById('errorOverlay');
    const errorTitle = document.getElementById('errorTitle');
    const errorMessage = document.getElementById('errorMessage');

    let watchId = null;

    // 1. 카메라 자동 시작
    async function initCamera() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('이 브라우저는 카메라 접근을 지원하지 않거나 HTTPS 연결이 아닙니다.');
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: 'environment' }, // 후면 카메라 우선
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });
        
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        showError('카메라 오류', getCameraErrorMessage(err));
      }
    }

    // 2. GPS 속도 추적 자동 시작
    function initLocation() {
      if (!navigator.geolocation) {
        showError('GPS 오류', '이 브라우저는 위치 서비스를 지원하지 않습니다.');
        return;
      }

      watchId = navigator.geolocation.watchPosition(
        (position) => {
          const speedMPS = position.coords.speed; // m/s 단위
          
          if (speedMPS !== null && !isNaN(speedMPS) && speedMPS >= 0) {
            const kmh = Math.round(speedMPS * 3.6);
            speedEl.textContent = kmh;
          } else {
            // 속도 측정 대기 중이거나 정지 상태
            speedEl.textContent = '0';
          }
        },
        (err) => {
          if (err.code === err.PERMISSION_DENIED) {
            showError('위치 권한이 거부되었습니다.', 'Safari의 [설정] > [웹사이트] > [위치/카메라]에서 권한을 \'허용\'으로 설정한 후 새로고침해 주세요.');
          } else if (err.code === err.POSITION_UNAVAILABLE) {
            speedEl.textContent = '--';
          } else {
            speedEl.textContent = '--';
          }
        },
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 10000
        }
      );
    }

    // 카메라 에러 메시지 분기 처리
    function getCameraErrorMessage(err) {
      if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
        return '카메라 권한이 거부되었습니다. Safari 설정에서 카메라 접근 권한을 허용으로 변경해 주세요.';
      }
      return '카메라를 시작할 수 없습니다. HTTPS 접속 여부를 확인해 주세요.';
    }

    // 에러 메세지 팝업 노출
    function showError(title, message) {
      errorTitle.textContent = title;
      errorMessage.textContent = message;
      errorOverlay.classList.remove('hidden');
    }

    // 페이지 진입 즉시 실행
    window.addEventListener('DOMContentLoaded', () => {
      initCamera();
      initLocation();
    });

    // 화면 떠날 때 트랙 및 GPS 정리
    window.addEventListener('pagehide', () => {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }
    });
  </script>
</body>
</html>
