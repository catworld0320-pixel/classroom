<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Riding GPS Recorder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    #hiddenVideo {
      display: none;
    }

    /* 상하단 여백 없이 화면 전체를 채우는 캔버스 */
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* 아이폰 스타일 녹화 버튼 (하단 중앙) */
    .controls {
      position: absolute;
      bottom: max(35px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .shutter-btn {
      appearance: none;
      border: none;
      background: transparent;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
    }

    .shutter-inner {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background-color: #ffffff;
      transition: all 0.2s ease;
    }

    /* 녹화 중 상태 (빨간색 동그라미 & 사각형 아이콘 스타일) */
    .shutter-btn.recording {
      border-color: rgba(255, 255, 255, 0.8);
    }

    .shutter-btn.recording .shutter-inner {
      background-color: #ff3b30;
      border-radius: 12px; /* 아이폰 정지 아이콘 모양 */
      width: 32px;
      height: 32px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(0.9); }
      100% { transform: scale(1); }
    }

    /* 에러 모달 */
    .error-overlay {
      position: absolute;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .error-card {
      background: #1c1c1e;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 24px 20px;
      max-width: 340px;
      width: 100%;
      text-align: center;
      color: #ffffff;
    }

    .error-card h2 {
      font-size: 20px;
      color: #ff453a;
      margin-bottom: 12px;
    }

    .error-card p {
      font-size: 14px;
      line-height: 1.5;
      color: #d1d1d6;
      margin-bottom: 20px;
      word-break: keep-all;
    }

    .reload-btn {
      appearance: none;
      border: none;
      background-color: #0a84ff;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <video id="hiddenVideo" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>

  <!-- 아이폰 스타일 셔터 버튼 -->
  <div class="controls">
    <button id="shutterBtn" class="shutter-btn" aria-label="녹화 시작/중지">
      <div class="shutter-inner"></div>
    </button>
  </div>

  <div id="errorOverlay" class="error-overlay hidden">
    <div class="error-card">
      <h2 id="errorTitle">권한 필요</h2>
      <p id="errorMessage">위치, 카메라 및 마이크 권한을 모두 허용해 주세요.</p>
      <button class="reload-btn" onclick="location.reload()">권한 변경 후 새로고침</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('hiddenVideo');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const shutterBtn = document.getElementById('shutterBtn');
    const errorOverlay = document.getElementById('errorOverlay');

    let currentSpeedKmh = 0;
    let lastPosition = null;
    let watchId = null;

    let mediaStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

      return R * c;
    }

    // 고화질 카메라 및 고음질 마이크 스트림 초기화
    async function initMedia() {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 3840 },  // 가능한 최고 화질(4K) 시도
            height: { ideal: 2160 },
            frameRate: { ideal: 60 } // 부드러운 화면을 위한 60fps 시도
          },
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        video.srcObject = mediaStream;
        await video.play();

        resizeCanvas();
        requestAnimationFrame(drawCanvas);
      } catch (err) {
        showError('장치 접근 실패', '카메라 또는 마이크 권한이 거부되었거나 HTTPS 접속이 아닙니다.');
      }
    }

    function initGPS() {
      if (!navigator.geolocation) return;

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, speed } = pos.coords;
          const timestamp = pos.timestamp || Date.now();

          let calculatedKmh = 0;

          if (speed !== null && !isNaN(speed) && speed >= 0) {
            calculatedKmh = speed * 3.6;
          } else if (lastPosition) {
            const timeDiff = (timestamp - lastPosition.timestamp) / 1000;
            if (timeDiff > 0.1) {
              const distance = getDistanceMeters(lastPosition.latitude, lastPosition.longitude, latitude, longitude);
              calculatedKmh = (distance / timeDiff) * 3.6;
            }
          }

          lastPosition = { latitude, longitude, timestamp };
          currentSpeedKmh = calculatedKmh < 3 ? 0 : Math.round(calculatedKmh);
        },
        (err) => {
          if (err.code === err.PERMISSION_DENIED) {
            showError('위치 권한 거부', 'Safari 설정에서 위치 권한을 허용해 주세요.');
          }
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
      );
    }

    // Canvas 렌더링 (숫자 아래에 km/h 배치)
    function drawCanvas() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const speedStr = isNaN(currentSpeedKmh) ? '--' : String(currentSpeedKmh);
        const unitStr = 'km/h';

        ctx.save();
        const startX = 35;
        const startY = 55;

        // 속도 숫자 그리기 (굵은 폰트 + 외곽선)
        ctx.font = '900 85px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';

        ctx.lineWidth = 6;
        ctx.strokeStyle = '#ffffff';
        ctx.strokeText(speedStr, startX, startY);

        ctx.fillStyle = '#000000';
        ctx.fillText(speedStr, startX, startY);

        // 숫자 바로 아래에 km/h 단위 배치
        ctx.font = '800 24px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif';
        ctx.lineWidth = 3;
        ctx.strokeText(unitStr, startX + 4, startY + 92);
        ctx.fillText(unitStr, startX + 4, startY + 92);

        ctx.restore();
      }

      requestAnimationFrame(drawCanvas);
    }

    // 레티나 디스플레이 및 전체 화면 해상도 대응 캔버스 크기 설정
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.scale(dpr, dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
    }

    // 고음질 오디오 트랙을 포함한 녹화 세팅
    function setupRecorder() {
      const canvasStream = canvas.captureStream(30);
      const audioTrack = mediaStream.getAudioTracks()[0];
      
      if (audioTrack) {
        canvasStream.addTrack(audioTrack);
      }

      const options = MediaRecorder.isTypeSupported('video/mp4') 
        ? { mimeType: 'video/mp4', videoBitsPerSecond: 8000000, audioBitsPerSecond: 128000 } 
        : { mimeType: 'video/webm;codecs=vp9,opus', videoBitsPerSecond: 8000000, audioBitsPerSecond: 128000 };

      try {
        mediaRecorder = new MediaRecorder(canvasStream, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(canvasStream); // 기본값 폴백
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      // 녹화 종료 시 공유 시트를 열어 갤러리(사진 앱)로 바로 저장 지원
      mediaRecorder.onstop = async () => {
        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/mp4' });
        recordedChunks = [];

        const fileExtension = mediaRecorder.mimeType && mediaRecorder.mimeType.includes('webm') ? 'webm' : 'mp4';
        const file = new File([blob], `riding_${Date.now()}.${fileExtension}`, { type: blob.type });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: '라이딩 영상',
              text: 'GPS 속도계가 포함된 라이딩 영상입니다.'
            });
            return;
          } catch (err) {
            if (err.name === 'AbortError') return;
          }
        }

        // 공유를 지원하지 않을 경우 다운로드 링크 생성
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `riding_record_${Date.now()}.${fileExtension}`;
        a.click();
      };
    }

    // 셔터 버튼 클릭 이벤트 (아이폰 스타일 녹화 시작/정지)
    shutterBtn.addEventListener('click', () => {
      if (!isRecording) {
        if (!mediaRecorder) setupRecorder();
        recordedChunks = [];
        mediaRecorder.start();
        isRecording = true;
        shutterBtn.classList.add('recording');
      } else {
        mediaRecorder.stop();
        isRecording = false;
        shutterBtn.classList.remove('recording');
      }
    });

    function showError(title, message) {
      document.getElementById('errorTitle').textContent = title;
      document.getElementById('errorMessage').textContent = message;
      errorOverlay.classList.remove('hidden');
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('DOMContentLoaded', () => {
      initMedia();
      initGPS();
    });

    window.addEventListener('pagehide', () => {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
    });
  </script>
</body>
</html>
