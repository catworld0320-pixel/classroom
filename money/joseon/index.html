<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>조선 급여</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard-container">
    <header class="header">
      <h1>조선 급여 및 개발현황</h1>
      <p class="subtitle">업데이트는 3~5분정도 걸림</p>
    </header>

    <section class="summary-cards">
      <div class="card dday-card">
        <div class="card-title">💰 다음 정산일</div>
        <div class="card-value" id="dday-text">D-00</div>
        <div class="card-sub">매월 24일정산</div>
      </div>

      <div class="card salary-card">
        <div class="card-title">💰 해당 구간 급여</div>
        <div class="card-value" id="card-period-salary">-</div>
        <div class="card-sub" id="card-period-label">기간: -</div>
      </div>
    </section>

    <!-- 탭 네비게이션 (model.js 데이터를 기반으로 JS가 자동 생성) -->
    <nav class="tab-nav" id="tab-container"></nav>

    <!-- 탭 콘텐츠 영역 -->
    <main class="main-content">
      <!-- 작업 내역 탭 -->
      <div id="tab-tasks" class="tab-content active">
        <div class="content-grid">
          <section class="panel">
            <div class="panel-header">
              <h2>완료된 작업</h2>
              <span class="badge" id="completed-count">0개</span>
            </div>
            <ul id="completed-list" class="item-list"></ul>
          </section>

          <section class="panel">
            <div class="panel-header">
              <h2>진행중인 작업</h2>
              <span class="badge warning" id="in-progress-count">0개</span>
            </div>
            <ul id="progress-list" class="item-list"></ul>
          </section>
        </div>
      </div>
      <div id="tab-salary" class="tab-content">
        <div class="panel full-width">
          <div class="panel-header">
            <h2>급여 내역</h2>
          </div>
          <div class="salary-grid" id="salary-grid"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="model.js"></script>
  <script src="script.js"></script>
</body>
</html>
