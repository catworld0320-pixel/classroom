<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>조선 급여 및 개발현황</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard-container">
    <div class="header-container">
      <div>
        <h1>조선 급여 및 개발현황</h1>
        <p class="subtitle">업데이트는 3~5분정도 걸림</p>
      </div>

      <!-- 정산 기간 선택 드롭다운 -->
      <div class="select-box">
        <label for="period-select">정산 기간 선택</label>
        <select id="period-select"></select>
      </div>
    </div>

    <!-- 상단 2열 카드 -->
    <div class="card-grid">
      <div class="card">
        <div class="card-header">
          <span class="icon">💰</span> 다음 정산일
        </div>
        <div class="card-value" id="dday">D-00</div>
        <div class="card-sub" id="dday-sub">매월 24일정산</div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="icon">💰</span> 해당 구간 급여
        </div>
        <div class="card-value" id="salary-amount">-</div>
        <div class="card-sub" id="salary-period">기간: -</div>
      </div>
    </div>

    <!-- 하단 2열 작업 현황 -->
    <div class="status-grid">
      <div class="card">
        <div class="section-header">
          <h2>완료된 작업</h2>
          <span class="badge green" id="completed-count">0개</span>
        </div>
        <ul class="task-list" id="completed-list"></ul>
      </div>

      <div class="card">
        <div class="section-header">
          <h2>진행중인 작업</h2>
          <span class="badge yellow" id="inprogress-count">0개</span>
        </div>
        <ul class="task-list" id="inprogress-list"></ul>
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
