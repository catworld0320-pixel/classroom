        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        /* 2560x1440 Stage Canvas */
        #stage {
            width: 2560px;
            height: 1440px;
            background-color: #ffffff;
            position: absolute;
            transform-origin: center center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .editor-item {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .editor-item svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 3개씩 자동 배치되는 무한 확장 메인 비디오 영역 */
        #main-video-section {
            position: absolute;
            left: 144px;
            top: 180px;
            width: 2330px;
            height: 1220px;
            overflow-y: auto;
            padding-right: 16px;
        }

        /* 메인 비디오 그리드: 3개마다 1줄씩 아래로 생성 */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
            padding-bottom: 60px;
        }

        /* Video Card Styling */
        .video-card {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 540px;
        }
        
        /* 클릭 가능한 썸네일 박스 영역 */
        .thumbnail-box {
            width: 100%;
            height: 420px;
            background-color: #000000;
            border-radius: 19px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: block;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .thumbnail-box:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 35px rgba(0,0,0,0.25);
        }
        
        /* 박스 내부 대체 안내 텍스트 */
        .thumbnail-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            gap: 12px;
        }
        .thumbnail-content svg {
            width: 64px;
            height: 64px;
            fill: #ff0000;
        }
        .thumbnail-content span {
            font-size: 20px;
            font-weight: 500;
            color: #aaaaaa;
        }

        .video-info {
            padding-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .video-title-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .channel-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: #e5e5e5;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid #ddd;
        }
        .video-title {
            color: #111111;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .video-title a {
            color: inherit;
            text-decoration: none;
        }
        .video-title a:hover {
            color: #065fd4;
        }
        .video-meta {
            color: #606060;
            font-size: 16px;
            font-weight: 500;
            margin-top: 2px;
            margin-left: 56px;
        }

        /* Search Bar Form Component */
        .search-bar-container {
            width: 100%;
            height: 100%;
            background: #ffffff;
            border: 2px solid #ccc;
            border-radius: 58px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-bar-container:focus-within {
            border-color: #065fd4;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
        }
        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 22px;
            color: #0f0f0f;
            background: transparent;
        }
        .search-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border-radius: 50%;
            transition: background-color 0.2s;
        }
        .search-btn:hover {
            background-color: #f2f2f2;
        }

        /* Scrollbar Styling */
        #main-video-section::-webkit-scrollbar {
            width: 10px;
        }
        #main-video-section::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 8px;
        }
        #main-video-section::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 8px;
        }

        /* Category Chip Style */
        .chip-btn {
            background: #f4f4f5;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 20px;
            font-weight: 500;
            width: 100%;
            height: 100%;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }
        .chip-btn.active {
            background: #0f0f0f;
            color: #ffffff;
        }
    </style>
</head>

    // 지정된 목록(기본 전체 목록 또는 필터링 목록) 그리드 렌더링
    function renderVideoGrid(items = videoList) {
        const container = document.getElementById("video-grid-container");
        if (!container) return;
        container.innerHTML = "";

        if (items.length === 0) {
            container.innerHTML = `
                <div style="grid-column: 1 / -1; padding: 100px 0; text-align: center; color: #777; font-size: 26px; font-weight: bold;">
                    검색 결과가 없습니다.
                </div>
            `;
            return;
        }

        items.forEach((video) => {
            const card = document.createElement("div");
            card.className = "video-card";
            
            const targetUrl = `https://revolution-operates-verified-consultation.trycloudflare.com/${video.customId}/index.html`;

            card.innerHTML = `
                <div id="${video.customId}" class="dynamic-watch-item video-card-inner" style="width:100%; height:100%;">
                    <a href="${targetUrl}" class="thumbnail-box">
                        <div class="thumbnail-content">
                            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                    </a>
                    <div class="video-info">
                        <div class="video-title-row">
                            <img class="channel-avatar" src="${video.avatar}" alt="${video.channel}">
                            <div class="video-title">
                                <a href="${targetUrl}">
                                    ${video.title} (ID: ${video.customId})
                                </a>
                            </div>
                        </div>
                        <div class="video-meta">${video.channel} · 조회수 ${video.views} · ${video.uploaded}</div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // 일치도 가중치 기반 동영상 제목 검색 함수
    function searchVideos(query) {
        const q = query.trim().toLowerCase();
        if (!q) {
            renderVideoGrid(videoList);
            return;
        }

        const scoredList = videoList.map(video => {
            const title = video.title.toLowerCase();
            let score = 0;

            // 1. 완벽 일치
            if (title === q) {
                score += 1000;
            }
            // 2. 검색어로 시작하는 경우
            else if (title.startsWith(q)) {
                score += 500;
            }

            // 3. 문장 내 부분 일치 (앞쪽에 위치할수록 높은 점수)
            const idx = title.indexOf(q);
            if (idx !== -1) {
                score += 300 - Math.min(idx, 100);
                score += Math.round((q.length / title.length) * 100);
            }

            // 4. 단어 단위 일치 (공백 기준 쪼갬)
            const words = q.split(/\s+/).filter(Boolean);
            let matchedWords = 0;
            words.forEach(word => {
                if (title.includes(word)) {
                    matchedWords++;
                    score += word.length * 30;
                }
            });
            score += matchedWords * 100;

            // 5. 글자 단위 일치 (부분 키워드 탐색 지원)
            if (score === 0) {
                let charCount = 0;
                for (const char of q) {
                    if (title.includes(char)) charCount++;
                }
                if (charCount >= Math.ceil(q.length * 0.5)) {
                    score += charCount * 10;
                }
            }

            return { video, score };
        });

        // 점수가 1점 이상인 결과만 추출한 후, 점수 내림차순(가장 일치하는 순) 정렬
        const filtered = scoredList
            .filter(item => item.score > 0)
            .sort((a, b) => b.score - a.score)
            .map(item => item.video);

        renderVideoGrid(filtered);
    }

    // 실시간 빠른 검색 이벤트 핸들러
    function handleSearchInput() {
        const inputEl = document.getElementById("search-input");
        searchVideos(inputEl.value);
    }

    // 엔터키 / 버튼 제출 핸들러
    function handleSearchSubmit(event) {
        event.preventDefault();
        handleSearchInput();
    }

    // 캔버스 반응형 스케일 조절
    function resizeStage() {
        const stage = document.getElementById('stage');
        if (!stage) return;
        const scaleX = window.innerWidth / 2560;
        const scaleY = window.innerHeight / 1440;
        stage.style.transform = `scale(${scaleX}, ${scaleY})`;
    }

    window.addEventListener('resize', resizeStage);
    window.addEventListener('load', () => {
        resizeStage();
        renderVideoGrid();
    });
</script>
