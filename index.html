<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 1. Meta Refresh Redirect (Immediate) -->
    <meta http-equiv="refresh" content="0; url=https://teamluma.xyz/www.career.go.kr/cloud/w/main/home">
    <title>페이지 이동 중... / Redirecting...</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 2. JavaScript Immediate Redirect
        window.location.href = "https://teamluma.xyz/www.career.go.kr/cloud/w/main/home";
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center space-y-6">
        <!-- Animated Loading Spinner -->
        <div class="flex justify-center">
            <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
        </div>

        <!-- Heading & Message -->
        <div class="space-y-2">
            <h1 class="text-xl font-bold text-gray-800">잠시만 기다려 주세요</h1>
            <p class="text-sm text-gray-600">지정한 페이지로 이동하고 있습니다.</p>
            <p class="text-xs text-gray-400">Redirecting to target page...</p>
        </div>

        <!-- 3. Fallback Link Container -->
        <div class="pt-4 border-t border-gray-100">
            <p class="text-xs text-gray-500 mb-3">
                자동으로 이동하지 않을 경우 아래 버튼을 클릭하세요.
            </p>
            <a href="https://teamluma.xyz/www.career.go.kr/cloud/w/main/home" 
               class="inline-block w-full py-3 px-6 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium text-sm rounded-xl transition duration-200 shadow-md hover:shadow-lg">
                직접 이동하기 (Go to Page)
            </a>
        </div>
    </div>
</body>
</html>
