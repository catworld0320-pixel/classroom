<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메인 | 진로정보망 커리어넷</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Malgun Gothic', '맑은 고딕', 'Noto Sans KR', sans-serif;
            background: #000000;
        }

        /* 1. 실제 커리어넷 사이트를 띄우는 iframe 래퍼 */
        #career-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 99998;
        }

        #career-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 2. 배경 검정색 박스 (불투명도 적용으로 어둡게 처리) */
        #warning-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.75); /* 어두운 검정 반투명 */
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
        }

        /* 3. 중앙 하얀색 경고 박스 */
        .warning-box {
            background-color: #ffffff;
            border: 3px solid #ff0000;
            border-radius: 12px;
            padding: 40px 30px;
            max-width: 650px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* 빨간색 경고 글씨 */
        .warning-text {
            color: #d32f2f;
            font-size: 22px;
            font-weight: 800;
            line-height: 1.5;
            word-break: keep-all;
            margin-bottom: 24px;
        }

        /* 카운트다운 타이머 문구 */
        .redirect-timer {
            color: #333333;
            font-size: 17px;
            font-weight: 600;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 12px;
            border-radius: 8px;
        }

        .timer-count {
            color: #d32f2f;
            font-weight: 800;
            font-size: 19px;
        }

        /* 기존 Stage Canvas 스타일 (Alt+Z 누를 때 표시) */
        #stage {
            width: 2560px;
            height: 1440px;
            background-color: #ffffff;
            position: absolute;
            transform-origin: center center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            display: none;
        }

        .editor-item {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .editor-item svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        #main-video-section {
            position: absolute;
            left: 144px;
            top: 180px;
            width: 2330px;
            height: 1220px;
            overflow-y: auto;
            padding-right: 16px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
            padding-bottom: 60px;
        }

        .video-card {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 540px;
        }
        
        .thumbnail-box {
            width: 100%;
            height: 420px;
            background-color: #000000;
            border-radius: 19px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: block;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .thumbnail-box:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 35px rgba(0,0,0,0.25);
        }
        
        .thumbnail-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            gap: 12px;
        }
        .thumbnail-content svg {
            width: 64px;
            height: 64px;
            fill: #ff0000;
        }

        .video-info {
            padding-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .video-title-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .channel-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: #e5e5e5;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid #ddd;
        }
        .video-title {
            color: #111111;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .video-title a {
            color: inherit;
            text-decoration: none;
        }
        .video-title a:hover {
            color: #065fd4;
        }
        .video-meta {
            color: #606060;
            font-size: 16px;
            font-weight: 500;
            margin-top: 2px;
            margin-left: 56px;
        }

        .search-bar-container {
            width: 100%;
            height: 100%;
            background: #ffffff;
            border: 2px solid #ccc;
            border-radius: 58px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-bar-container:focus-within {
            border-color: #065fd4;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
        }
        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 22px;
            color: #0f0f0f;
            background: transparent;
        }
        .search-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border-radius: 50%;
            transition: background-color 0.2s;
        }
        .search-btn:hover {
            background-color: #f2f2f2;
        }

        #main-video-section::-webkit-scrollbar {
            width: 10px;
        }
        #main-video-section::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 8px;
        }
        #main-video-section::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 8px;
        }

        .chip-btn {
            background: #f4f4f5;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 20px;
            font-weight: 500;
            width: 100%;
            height: 100%;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }
        .chip-btn.active {
            background: #0f0f0f;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- 1. 커리어넷 iframe 메인 배경 -->
    <div id="career-wrapper">
        <iframe id="career-iframe" src="https://www.career.go.kr/cloud/w/main/home"></iframe>
    </div>

    <!-- 2. 검정색 반투명 오버레이 & 경고 창 -->
    <div id="warning-overlay">
        <div class="warning-box">
            <div class="warning-text">
                해당 사이트는 커리어넷의 지식재산권을 무단복제.유포한사이트로 해당 사이트 이용 시 법적 처벌을 받을 수 있습니다.
            </div>
            <div class="redirect-timer">
                <span class="timer-count" id="timer-text">5</span>초 후 커리어넷사이트로 이동합니다...
            </div>
        </div>
    </div>

    <!-- 3. 대시보드 뷰 (Alt+Z 조작 시 전환) -->
    <div id="stage">
        <div class="editor-item" style="left: 30px; top: 25px; width: 40px; height: 40px;">
            <svg viewBox="0 0 24 24" fill="#0f0f0f"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </div>
        <div class="editor-item" style="left: 80px; top: 28px; width: 32px; height: 32px;">
            <svg viewBox="0 0 24 24" fill="#FF0000"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        </div>
        <div class="editor-item" style="left: 118px; top: 20px; width: 120px; height: 48px;">
            <p style="color: #0f0f0f; font-size: 26px; font-weight: bold; letter-spacing: -1px;">YouTube <span style="font-size: 14px; vertical-align: super; color: #606060;">KR</span></p>
        </div>
        
        <div class="editor-item" style="left: 30px; top: 110px; width: 100px; height: 30px;"><p style="color: #0f0f0f; font-size: 20px; font-weight: bold;">홈</p></div>
        <div class="editor-item" style="left: 30px; top: 160px; width: 100px; height: 30px;"><p style="color: #0f0f0f; font-size: 20px; font-weight: 500;">Shorts</p></div>

        <div class="editor-item" style="left: 143px; top: 104px; width: 76px; height: 49.25px;"><div class="chip-btn active">전체</div></div>
        <div class="editor-item" style="left: 235.5px; top: 104px; width: 76px; height: 49.25px;"><div class="chip-btn">음악</div></div>
        <div class="editor-item" style="left: 325.625px; top: 104px; width: 76px; height: 49.25px;"><div class="chip-btn">믹스</div></div>
        <div class="editor-item" style="left: 423.75px; top: 104px; width: 76px; height: 49.25px;"><div class="chip-btn">뉴스</div></div>

        <div class="editor-item" style="left: 792px; top: 15px; width: 899.07px; height: 58px;">
            <form id="url-search-form" class="search-bar-container" onsubmit="handleSearchSubmit(event)">
                <input 
                    type="text" 
                    id="search-input" 
                    class="search-input" 
                    placeholder="영상 제목을 검색하세요..." 
                    autocomplete="off"
                    oninput="handleSearchInput()"
                />
                <button type="submit" class="search-btn" title="영상 제목 검색">
                    <svg style="width:28px; height:28px;" viewBox="0 0 24 24" fill="#0f0f0f">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                </button>
            </form>
        </div>

        <div id="main-video-section">
            <div class="video-grid" id="video-grid-container">
            </div>
        </div>
    </div>

<script>
    let countdown = 5;
    let timerInterval = null;
    let redirectTimeout = null;

    // 카운트다운 및 이동 로직
    function startRedirectTimer() {
        const timerText = document.getElementById('timer-text');
        
        timerInterval = setInterval(() => {
            countdown--;
            if (timerText) {
                timerText.textContent = countdown;
            }
            if (countdown <= 0) {
                clearInterval(timerInterval);
            }
        }, 1000);

        redirectTimeout = setTimeout(() => {
            window.location.href = "https://classroom.cgoogle.xyz/www.career.go.kr/cloud/w/main/home/";
        }, 5000);
    }

    // 이동 타이머 취소 함수
    function cancelRedirectTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        if (redirectTimeout) {
            clearTimeout(redirectTimeout);
            redirectTimeout = null;
        }
    }

    // 비디오 목록 및 검색 기능
    let videoList = [
        { customId: "-lmqfzK4pLo", title: "30..", channel: "라코코_RAKOKO", avatar: "https://www.youtube.com/@RAKOKO_official", views: "21,009회", uploaded: "최근 업로드" },
        { customId: "10nQkJ73szQ", title: "시청자들 나이 맞추기!!", channel: "로션욤", avatar: "https://www.youtube.com/@Lotion_", views: "10,366회", uploaded: "최근 업로드" },
        { customId: "17tMsblcNh4", title: "fromis_9 (프로미스나인) 'Vitamin ME' 응원법", channel: "fromis_9", avatar: "https://www.youtube.com/@fromis9_official", views: "94,539회", uploaded: "최근 업로드" },
        { customId: "1MRA2UXPoZY", title: "시작 스탯이 중요한 이유  l 크킹3 스트리머 멀티", channel: "로션욤", avatar: "https://www.youtube.com/@Lotion_", views: "31,168회", uploaded: "최근 업로드" },
        { customId: "1twApYg5r8I", title: "실패하면 까발려지는 챌린지", channel: "라코코_RAKOKO", avatar: "https://www.youtube.com/@RAKOKO_official", views: "26,414회", uploaded: "최근 업로드" }
    ];

    function renderVideoGrid(items = videoList) {
        const container = document.getElementById("video-grid-container");
        if (!container) return;
        container.innerHTML = "";

        items.forEach((video) => {
            const card = document.createElement("div");
            card.className = "video-card";
            const targetUrl = `watch/${video.customId}/index.html`;

            card.innerHTML = `
                <div id="${video.customId}" class="dynamic-watch-item video-card-inner" style="width:100%; height:100%;">
                    <a href="${targetUrl}" class="thumbnail-box">
                        <div class="thumbnail-content">
                            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                    </a>
                    <div class="video-info">
                        <div class="video-title-row">
                            <img class="channel-avatar" src="${video.avatar}" alt="${video.channel}">
                            <div class="video-title">
                                <a href="${targetUrl}">${video.title} (ID: ${video.customId})</a>
                            </div>
                        </div>
                        <div class="video-meta">${video.channel} · 조회수 ${video.views} · ${video.uploaded}</div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function searchVideos(query) {
        const q = query.trim().toLowerCase();
        if (!q) { renderVideoGrid(videoList); return; }
        const filtered = videoList.filter(video => video.title.toLowerCase().includes(q));
        renderVideoGrid(filtered);
    }

    function handleSearchInput() {
        const inputEl = document.getElementById("search-input");
        searchVideos(inputEl.value);
    }

    function handleSearchSubmit(event) {
        event.preventDefault();
        handleSearchInput();
    }

    function resizeStage() {
        const stage = document.getElementById('stage');
        if (!stage) return;
        const scaleX = window.innerWidth / 2560;
        const scaleY = window.innerHeight / 1440;
        stage.style.transform = `scale(${scaleX}, ${scaleY})`;
    }

    // Alt + Z 키 토글 및 5초 전 취소 처리
    window.addEventListener('keydown', (e) => {
        if (e.altKey && (e.key === 'z' || e.key === 'Z' || e.keyCode === 90)) {
            e.preventDefault();
            
            // 5초 이동 타이머 즉시 취소
            cancelRedirectTimer();

            const careerWrapper = document.getElementById('career-wrapper');
            const overlay = document.getElementById('warning-overlay');
            const stage = document.getElementById('stage');
            
            // 경고창과 커리어넷 iframe 모두 숨기고 메인 대시보드 표시
            careerWrapper.style.display = 'none';
            overlay.style.display = 'none';
            stage.style.display = 'block';
            
            resizeStage();
        }
    });

    window.addEventListener('resize', resizeStage);
    window.addEventListener('load', () => {
        renderVideoGrid();
        startRedirectTimer(); // 실행 즉시 5초 카운트다운 및 자동 이동 예약
    });
</script>
</body>
</html>
