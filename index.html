<script>
    function resizeStage() {
        const stage = document.getElementById('stage');
        const windowWidth = window.innerWidth;
        const windowHeight = window.innerHeight;

        // X축과 Y축 배율을 독립적으로 계산 (너비와 높이 각각에 딱 맞춤)
        const scaleX = windowWidth / 2560;
        const scaleY = windowHeight / 1400;

        // scale(X, Y) 형태로 X와 Y를 따로 늘려 화면 전체에 채움
        stage.style.transform = `scale(${scaleX}, ${scaleY})`;
    }

    window.addEventListener('resize', resizeStage);
    window.addEventListener('load', resizeStage);
</script>
