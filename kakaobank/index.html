    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
        height: 100%;
            overflow: hidden;              /* 메인 페이지 스크롤 차단 */
            overscroll-behavior: none;     /* 끌어당김/고무줄 효과 차단 */
        }

        /* 모바일(iOS)에서는 화면에 고정 */
        @media (max-width: 639px) {
            body {
                position: fixed;
                inset: 0;
                width: 100%;
            }
        }

        /* 내부 스크롤 영역이 끝에 닿아도 바깥으로 스크롤이 전달되지 않게 */
        #scrollableArea {
            overscroll-behavior: contain;
        }
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #ffffff;
            user-select: none;
        }
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(0, 0, 0, 0.15);
            border-radius: 4px;
        }
        .no-scrollbar {
            scrollbar-width: none;        /* Firefox */
            -ms-overflow-style: none;     /* 구형 Edge */
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;                /* Chrome, Safari */
        }

        /* 하단 블러 + 페이드 오버레이: 스크롤 콘텐츠 위, 버튼 바 아래 */
        .bottom-fade {
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.85) 100%);
            -webkit-backdrop-filter: blur(2px);
            backdrop-filter: blur(2px);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, #000 100%);
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 m-0 sm:py-6">

        <!-- [이미지 레이어 2] 원본 이미지를 복제하여 상단 45px만 표시 (고정 탑바 영역)

             - 바깥 래퍼가 overflow-hidden + h-[45px]로 표시 영역만 제어 -->
        <div class="absolute top-0 left-0 w-full h-[100px] overflow-hidden z-[30] pointer-events-none">
            <div class="absolute top-0 left-0 w-full h-[100vh] sm:h-[920px]">
                <img src="image_b96075.png" alt="" aria-hidden="true" class="w-full h-full object-cover">
            </div>
        </div>

        <!-- 3. SCROLLABLE AREA: 위에서 45px 아래부터 버튼 바 위까지 전체가 함께 스크롤됨 -->
        <div id="scrollableArea" class="absolute top-[45px] left-0 right-0 bottom-[90px] overflow-y-auto no-scrollbar z-20 bg-white">

            <!-- 스크롤 콘텐츠 래퍼 (이미지 + 잔액 + 거래내역이 모두 이 안에서 같이 움직임) -->
            <div id="scrollContent" class="relative w-full overflow-hidden min-h-[calc(100vh-45px)] sm:min-h-[875px]">

                <!-- [이미지 레이어 1] 스크롤 영역과 합성되는 배경 이미지
                     원래 화면 좌표(전체 컨테이너 기준)를 그대로 유지하도록 top -45px 로 정렬 -->
                <div class="absolute left-0 top-[-45px] w-full h-[100vh] sm:h-[920px] pointer-events-none z-0">
                    <img src="image_b96075.png" alt="background" class="w-full h-full object-cover">
                </div>

                <!-- 1. WHITE COVER OVER ORIGINAL BALANCE AREA (원래 top 160 → 스크롤 좌표 115) -->
                <div class="absolute top-[56px] left-[24px] w-[280px] h-[48px] bg-[#FFFFFF] z-20"></div>

                <div class="absolute top-[300px] left-0 right-0 bottom-0 bg-[#FFFFFF] z-10"></div>

                <!-- TRANSACTION CONTAINER -->

                        <!-- Dynamic Transactions injected here -->
                    </div>
                    <div class="h-12"></div>
                </div>
            </div>
        </div>

        <!-- 3-1. 스크롤 영역 하단 블러 + 페이드 (스크롤 영역 하단에만 적용, 클릭 방해 없음) -->
        <div class="bottom-fade absolute left-0 right-[0px] bottom-[90px] h-[48px] z-[25] pointer-events-none"></div>

                        <!-- Dynamic Group Editor items -->

        // Render main view transactions
        function renderTransactions() {
            const container = document.getElementById('transactionContainer');
            let html = '';

            appData.groups.forEach((group, gIdx) => {
                html += `
                    <div>
                        <div class="text-[15px] font-bold text-gray-800 mb-3">${group.date}</div>
                        <div class="space-y-4">
                `;

                group.items.forEach((item, iIdx) => {
                    // Check if amount starts with '-' -> Black, else Blue (#3182ce)
                    const isNegative = item.amount.trim().startsWith('-');
                    const amountColorClass = isNegative ? 'text-gray-900 font-bold' : 'text-[#3182ce] font-bold';

                    html += `
                        <div class="flex justify-between items-start py-0.5">
                            <div>
                                <div class="text-[15px] font-semibold text-gray-900">${item.name}</div>
                                <div class="text-[13px] text-gray-400 mt-0.5">${item.time}</div>
                            </div>
                            <div class="text-right">
                                <div class="text-[15px] ${amountColorClass}">${item.amount}</div>
                                <div class="text-[13px] text-gray-400 mt-0.5">${item.balance}</div>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
            });

            container.innerHTML = html;
        }

        // Render editor panel form
        function renderEditorForm() {
            const editorList = document.getElementById('txEditorList');
            let html = '';

            appData.groups.forEach((group, gIdx) => {
                html += `
                    <div class="p-3.5 bg-gray-50 rounded-2xl border border-gray-200/80 space-y-3">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-gray-500 w-12">날짜:</span>
                            <input type="text" value="${group.date}" onchange="updateGroupDate(${gIdx}, this.value)" class="flex-1 border border-gray-300 rounded-xl px-3 py-1.5 text-xs bg-white font-bold">
                            <button onclick="removeGroup(${gIdx})" class="text-red-500 hover:text-red-700 text-xs font-bold px-2 py-1">삭제</button>
                        </div>
                        <div class="space-y-2.5 pl-2 border-l-2 border-blue-200">
                `;

                group.items.forEach((item, iIdx) => {
                    html += `
                        <div class="bg-white p-2.5 rounded-xl border border-gray-200 space-y-2 shadow-2xs">
                            <div class="flex gap-2">
                                <input type="text" placeholder="입금자명" value="${item.name}" onchange="updateItem(${gIdx}, ${iIdx}, 'name', this.value)" class="w-1/2 border border-gray-300 rounded-lg px-2.5 py-1 text-xs">
                                <input type="text" placeholder="시간" value="${item.time}" onchange="updateItem(${gIdx}, ${iIdx}, 'time', this.value)" class="w-1/2 border border-gray-300 rounded-lg px-2.5 py-1 text-xs">
                            </div>
                            <div class="flex gap-2">
                                <input type="text" placeholder="액수 (-50,000원)" value="${item.amount}" onchange="updateItem(${gIdx}, ${iIdx}, 'amount', this.value)" class="w-1/2 border border-gray-300 rounded-lg px-2.5 py-1 text-xs">
                                <input type="text" placeholder="잔액" value="${item.balance}" onchange="updateItem(${gIdx}, ${iIdx}, 'balance', this.value)" class="w-1/2 border border-gray-300 rounded-lg px-2.5 py-1 text-xs">
                            </div>
                            <div class="flex justify-end">
                                <button onclick="removeItem(${gIdx}, ${iIdx})" class="text-red-400 hover:text-red-600 text-[11px] font-semibold">내역 삭제</button>
                            </div>
                        </div>
                    `;
                });

                html += `
                            <button onclick="addItem(${gIdx})" class="w-full py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-xl text-xs font-bold transition mt-1">+ 거래내역 추가</button>
                        </div>
                    </div>
                `;
            });

            editorList.innerHTML = html;
        }

        // Data mutators
        function updateGroupDate(gIdx, val) {
            appData.groups[gIdx].date = val;
            renderTransactions();
        }

        function updateItem(gIdx, iIdx, field, val) {
            appData.groups[gIdx].items[iIdx][field] = val;
            renderTransactions();
        }

        function removeItem(gIdx, iIdx) {
            appData.groups[gIdx].items.splice(iIdx, 1);
            renderTransactions();
            renderEditorForm();
        }

        function addItem(gIdx) {
            appData.groups[gIdx].items.push({ name: "새 거래", time: "12:00", amount: "-10,000원", balance: "0원" });

            renderEditorForm();
        }

            appData.groups.push({
                date: "새 날짜",
                items: [{ name: "입금자", time: "12:00", amount: "10,000원", balance: "0원" }]

            renderEditorForm();
        }

        function removeGroup(gIdx) {
            appData.groups.splice(gIdx, 1);
            renderTransactions();
            renderEditorForm();
        }

        function toggleEditPanel() {
            const panel = document.getElementById('editPanel');
            if (panel.classList.contains('translate-y-full')) {
                panel.classList.remove('translate-y-full');
            } else {
                panel.classList.add('translate-y-full');
            }
        }

        function showAlert(msg) {
            document.getElementById('alertMessage').innerText = msg;
            document.getElementById('customAlert').classList.remove('hidden');
        }

        function closeAlert() {
            document.getElementById('customAlert').classList.add('hidden');
