<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시내버스 LED 안내전광판</title>
    <!-- 둥근모꼴 웹폰트 -->
    <link href="https://hangeul.pstatic.net/hangeul_font/css/dunggeunmo.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #222;
            color: #fff;
            font-family: 'DungGeunMo', monospace;
            min-height: 100vh;
            padding: 20px;
        }

        /* 컨트롤 패널 및 하단 정보 레이아웃 */
        .main-container {
            width: 100%;
            max-width: calc(100% - 400px); /* 우측 노선도 공간 확보 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            gap: 0px;
        }

        .control-panel {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background-color: #111;
            color: #00ff00;
            border: 2px solid #00ff00;
            font-family: 'DungGeunMo', monospace;
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #00ff00;
            color: #000;
        }

        button.active {
            background-color: #00ff00;
            color: #000;
        }

        .status-text {
            font-size: 12px;
            color: #888;
            text-align: center;
        }

        .top-right-section {
            position: fixed;
            top: 20px;
            right: 340px;
            width: 630px; /* 기존 고정 너비 유지 */
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 9998;
        }

        .led-board {
            width: 100%;
            height: 220px;
            background-color: #000;
            border: 5px solid #fff;
            border-radius: 4px;
            padding: 20px 25px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .led-top-bar {
            position: absolute;
            top: 5px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #ffaa00;
        }

        .row-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: center;
            margin-top: 15px;
        }

        .label-tag {
            font-size: 84px;
            color: #00ff00;
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.6);
            letter-spacing: -1px;
        }

        .station-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            height: 84px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .station-container.scrolling-active {
            justify-content: flex-start;
        }

        .station-main {
            font-size: 84px;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
            display: inline-block;
        }

        .station-main.scrolling {
            position: absolute;
            left: 0;
        }

        @keyframes slideToRightEnd {
            0% { transform: translateX(0); }
            100% { transform: translateX(var(--scroll-end, -100px)); }
        }

        .top-right-section {
            position: fixed;
            top: 20px;
            right: 340px;
            width: 630px; /* 기존 고정 너비 유지 */
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 9998;
        }

        /* iframe 높이를 354px로 맞춰 16:9 비율 공간 확보 */
        .sub-content-frame {
            width: 100%;
            height: 354px; 
            border: none;
            background: transparent;
            border-radius: 8px;
            overflow: hidden;
        }

        /* ========================================================
           2. 화면 맨 오른쪽 독립 노선도 CSS
           ======================================================== */
        .bus-app-route-panel {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 320px;
            height: 100vh;
            background-color: #ffffff;
            color: #333333;
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            z-index: 9999;
        }

        .bus-app-header {
            background-color: #f8f9fa;
            padding: 16px;
            border-bottom: 1px solid #eeeeee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bus-app-title {
            font-size: 16px;
            font-weight: bold;
            color: #222;
        }

        .bus-app-badge {
            background-color: #2b77f6;
            color: #fff;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 500;
        }

        .bus-app-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px 10px 15px 20px;
        }

        .bus-app-list-container::-webkit-scrollbar {
            width: 6px;
        }
        .bus-app-list-container::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }

        .bus-app-station-row {
            position: relative;
            display: flex;
            align-items: center;
            min-height: 56px;
            padding-left: 30px;
            cursor: pointer;
        }

        .bus-app-station-row::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 0;
            bottom: 0;
            width: 3px;
            background-color: #c0e0b0;
            z-index: 1;
        }

        .bus-app-station-row:first-child::before { top: 50%; }
        .bus-app-station-row:last-child::before { bottom: 50%; }

        .bus-app-circle {
            position: absolute;
            left: 5px;
            width: 13px;
            height: 13px;
            background-color: #fff;
            border: 3px solid #84c464;
            border-radius: 50%;
            z-index: 2;
        }

        .bus-app-name {
            font-size: 14px;
            color: #444;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 220px;
        }

        .bus-app-station-row.is-current .bus-app-name {
            color: #2b77f6;
            font-weight: bold;
            font-size: 15px;
        }

        .bus-app-station-row.is-current .bus-app-circle {
            background-color: #2b77f6;
            border-color: #2b77f6;
            box-shadow: 0 0 0 3px rgba(43, 119, 246, 0.2);
        }

        .bus-app-icon-badge {
            display: none;
            position: absolute;
            left: -8px;
            z-index: 3;
            background-color: #38b653;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-weight: bold;
            align-items: center;
        }

        .bus-app-station-row.is-current .bus-app-icon-badge {
            display: flex;
        }
    </style>
</head>
<body>

    <!-- 오른쪽 위 섹션 (전광판 + 그 바로 아래 외부 HTML) -->
    <div class="top-right-section">
        <!-- 1. 기존 LED 전광판 -->
        <div class="led-board">
            <div class="led-top-bar">
                <span id="boardBusNum">NO. ---</span>
                <span id="boardState">대기중</span>
            </div>

            <div class="row-group">
                <div class="label-tag" id="displayLabel">이번정류소</div>
                <div class="station-container" id="stationContainer">
                    <div id="displayStationName" class="station-main">준비중</div>
                </div>
            </div>
        </div>

        <!-- 2. 🆕 전광판 바로 아래에 독립적으로 불려올 외부 HTML 파일 -->
        <iframe src="sub_content.html" class="sub-content-frame" id="subFrame"></iframe>
    </div>

    <!-- 메인 컨트롤 영역 -->
    <div class="main-container">
        <div class="control-panel">
            <button id="prevBtn">◀ 이전</button>
            <button id="playBtn">▶ 재생 / 다음</button>
            <button id="autoBtn">자동 재생: OFF</button>
            <button id="resetBtn">⏹ 처음으로</button>
        </div>
        <div id="sequenceInfo" class="status-text">시퀀스: 0 / 0</div>
    </div>

    <!-- 맨 우측 독립 노선도 -->
    <div class="bus-app-route-panel">
        <div class="bus-app-header">
            <span class="bus-app-title" id="appBusTitle">실시간 노선도</span>
            <span class="bus-app-badge">운행중</span>
        </div>
        <div class="bus-app-list-container" id="appStationList"></div>
    </div>

    <!-- stop.js 불러오기 -->
    <script src="stop.js?v=7.0"></script>
    <script>
        let currentIndex = 0;
        let stepTimer = null;
        let autoPlayEnabled = false;
        const audioPlayer = new Audio();

        const boardBusNum = document.getElementById('boardBusNum');
        const boardState = document.getElementById('boardState');
        const displayLabel = document.getElementById('displayLabel');
        const displayStationName = document.getElementById('displayStationName');
        const stationContainer = document.getElementById('stationContainer');
        const sequenceInfo = document.getElementById('sequenceInfo');

        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const autoBtn = document.getElementById('autoBtn');
        const resetBtn = document.getElementById('resetBtn');

        function initBoard() {
            if (typeof busConfig !== 'undefined') {
                boardBusNum.innerText = `NO. ${busConfig.busNumber}`;
                initStandaloneAppRoute();
                showStaticCurrent();
            } else {
                boardState.innerText = "stop.js 로드 실패";
            }
        }

        function setStationText(text) {
            displayStationName.innerText = text;
            displayStationName.style.animation = 'none';
            displayStationName.offsetHeight; 

            if (text.length > 7) {
                stationContainer.classList.add('scrolling-active');
                displayStationName.classList.add('scrolling');

                setTimeout(() => {
                    const textWidth = displayStationName.offsetWidth;
                    const containerWidth = stationContainer.offsetWidth;
                    const distance = containerWidth - textWidth;
                    
                    if (distance < 0) {
                        const speed = 75; 
                        const duration = Math.abs(distance) / speed; 
                        displayStationName.style.animation = `slideToRightEnd ${duration}s linear forwards`;
                        displayStationName.style.setProperty('--scroll-end', `${distance}px`);
                    }
                }, 10);
            } else {
                stationContainer.classList.remove('scrolling-active');
                displayStationName.classList.remove('scrolling');
            }
        }

        function showStaticCurrent() {
            if (!busConfig || !busConfig.sequence.length) return;
            const seq = busConfig.sequence[currentIndex];
            const currStation = stationDB[seq.current];

            boardBusNum.innerText = `NO. ${busConfig.busNumber}`;
            sequenceInfo.innerText = `시퀀스: ${currentIndex + 1} / ${busConfig.sequence.length}`;

            if (currStation) {
                displayLabel.innerText = "이번정류소";
                setStationText(currStation.name);
            }

            updateStandaloneAppRoute(currentIndex);
        }

        function startSequenceCycle() {
            if (!busConfig || !busConfig.sequence.length) return;
            
            if (stepTimer) {
                clearTimeout(stepTimer);
                stepTimer = null;
            }

            const seq = busConfig.sequence[currentIndex];
            const currStation = stationDB[seq.current];
            const nextStation = seq.next ? stationDB[seq.next] : null;

            boardState.innerText = "안내중";

            displayLabel.innerText = "이번정류소";
            setStationText(currStation.name);

            stepTimer = setTimeout(() => {
                displayLabel.innerText = "다음정류소";
                if (nextStation) {
                    setStationText(nextStation.name);
                } else {
                    setStationText("마지막 정류소");
                }

                stepTimer = setTimeout(() => {
                    if (currStation.englishName) {
                        displayLabel.innerText = "This Stop";
                        setStationText(currStation.englishName);
                        
                        stepTimer = setTimeout(() => {
                            loopRandomNotices();
                        }, 4000);
                    } else {
                        loopRandomNotices();
                    }
                }, 4000);
            }, 4000);
        }

        function loopRandomNotices() {
            if (stepTimer) {
                clearTimeout(stepTimer);
                stepTimer = null;
            }

            if (typeof noticePool !== 'undefined' && noticePool.length > 0) {
                const randomIndex = Math.floor(Math.random() * noticePool.length);
                const randomNotice = noticePool[randomIndex];

                displayLabel.innerText = "안내사항";
                setStationText(randomNotice);

                stepTimer = setTimeout(() => {
                    loopRandomNotices(); 
                }, 7000);
            } else {
                startSequenceCycle();
            }
        }

        function playCurrentSequence() {
            if (!busConfig || !busConfig.sequence.length) return;

            if (stepTimer) {
                clearTimeout(stepTimer);
                stepTimer = null;
            }
            showStaticCurrent();

            const seq = busConfig.sequence[currentIndex];
            
            if (seq.audio) {
                audioPlayer.src = seq.audio;
                audioPlayer.play().catch(e => {
                    if (seq.audio.endsWith('.mp3')) {
                        audioPlayer.src = seq.audio.replace('.mp3', '.MP3');
                        audioPlayer.play().catch(err => console.log("오디오 재생 오류:", err));
                    } else if (seq.audio.endsWith('.MP3')) {
                        audioPlayer.src = seq.audio.replace('.MP3', '.mp3');
                        audioPlayer.play().catch(err => console.log("오디오 재생 오류:", err));
                    }
                });
            }

            startSequenceCycle();
        }

        audioPlayer.onended = () => {
            if (autoPlayEnabled) {
                setTimeout(() => {
                    if (currentIndex < busConfig.sequence.length - 1) {
                        currentIndex++;
                        playCurrentSequence();
                    } else {
                        currentIndex = 0;
                        playCurrentSequence();
                    }
                }, 1000);
            }
        };

        playBtn.addEventListener('click', () => {
            playCurrentSequence();
            if (currentIndex < busConfig.sequence.length - 1) {
                currentIndex++;
            }
        });

        prevBtn.addEventListener('click', () => {
            audioPlayer.pause();
            if (stepTimer) {
                clearTimeout(stepTimer);
                stepTimer = null;
            }
            if (currentIndex > 0) {
                currentIndex--;
            }
            showStaticCurrent();
            boardState.innerText = "대기중";
        });

        autoBtn.addEventListener('click', () => {
            autoPlayEnabled = !autoPlayEnabled;
            if (autoPlayEnabled) {
                autoBtn.innerText = "자동 재생: ON";
                autoBtn.classList.add('active');
            } else {
                autoBtn.innerText = "자동 재생: OFF";
                autoBtn.classList.remove('active');
            }
        });

        resetBtn.addEventListener('click', () => {
            audioPlayer.pause();
            if (stepTimer) {
                clearTimeout(stepTimer);
                stepTimer = null;
            }
            currentIndex = 0;
            showStaticCurrent();
            boardState.innerText = "대기중";
        });

        // 독립 노선도 로직
        const appStationListEl = document.getElementById('appStationList');
        const appBusTitleEl = document.getElementById('appBusTitle');

        function initStandaloneAppRoute() {
            if (!appStationListEl || typeof busConfig === 'undefined') return;

            if (busConfig.busNumber) {
                appBusTitleEl.innerText = `${busConfig.busNumber} 노선도`;
            }

            appStationListEl.innerHTML = '';

            busConfig.sequence.forEach((seq, idx) => {
                const station = stationDB[seq.current];
                if (station) {
                    const row = document.createElement('div');
                    row.className = 'bus-app-station-row';
                    row.id = `standalone-app-row-${idx}`;

                    row.innerHTML = `
                        <div class="bus-app-circle"></div>
                        <div class="bus-app-icon-badge">🚌 버스</div>
                        <div class="bus-app-name">${station.name}</div>
                    `;

                    row.addEventListener('click', () => {
                        audioPlayer.pause();
                        if (stepTimer) {
                            clearTimeout(stepTimer);
                            stepTimer = null;
                        }
                        currentIndex = idx;
                        showStaticCurrent();
                        boardState.innerText = "대기중";
                    });

                    appStationListEl.appendChild(row);
                }
            });
        }

        function updateStandaloneAppRoute(targetIndex) {
            const rows = document.querySelectorAll('.bus-app-station-row');
            rows.forEach((row, idx) => {
                if (idx === targetIndex) {
                    row.classList.add('is-current');
                    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else {
                    row.classList.remove('is-current');
                }
            });
        }

        window.onload = initBoard;
        // stop.js에서 정의한 busConfig 및 stationDB가 전역(window)에 위치하는지 확인
        window.onload = function() {
            initBoard();
        };

        function showStaticCurrent() {
            // stationDB 및 busConfig 존재 체크
            if (typeof busConfig === 'undefined' || typeof stationDB === 'undefined') {
                console.error("stop.js가 제대로 로드되지 않았습니다.");
                return;
            }

            if (!busConfig.sequence || busConfig.sequence.length === 0) return;

            const seq = busConfig.sequence[currentIndex];
            const currStation = stationDB[seq.current];

            boardBusNum.innerText = `NO. ${busConfig.busNumber}`;
            sequenceInfo.innerText = `시퀀스: ${currentIndex + 1} / ${busConfig.sequence.length}`;

            if (currStation) {
                displayLabel.innerText = "이번정류소";
                setStationText(currStation.name);
            }

            updateStandaloneAppRoute(currentIndex);
            
            // 🆕 iframe(티머니 단말기)으로 현재 정류장 정보 전송
            const subFrame = document.getElementById('subFrame');
            if (subFrame && subFrame.contentWindow) {
                try {
                    subFrame.contentWindow.updateFromParent(busConfig.busNumber, currStation ? currStation.name : '');
                } catch(e) {
                    console.log("iframe 통신 중...", e);
                }
            }
        }
        // 🆕 iframe으로 현재 정류장 데이터를 안전하게 보낼 함수
        function sendStationToIframe() {
            if (typeof busConfig === 'undefined' || typeof stationDB === 'undefined') return;
            if (!busConfig.sequence || busConfig.sequence.length === 0) return;

            const seq = busConfig.sequence[currentIndex];
            const currStation = stationDB[seq.current];

            const subFrame = document.getElementById('subFrame');
            if (subFrame && subFrame.contentWindow) {
                subFrame.contentWindow.postMessage({
                    type: 'UPDATE_STATION',
                    busNumber: busConfig.busNumber || '---',
                    stationName: currStation ? currStation.name : '정류장 없음'
                }, '*');
            }
        }

        // 기존 showStaticCurrent 함수 수정
        function showStaticCurrent() {
            if (!busConfig || !busConfig.sequence.length) return;
            const seq = busConfig.sequence[currentIndex];
            const currStation = stationDB[seq.current];

            boardBusNum.innerText = `NO. ${busConfig.busNumber}`;
            sequenceInfo.innerText = `시퀀스: ${currentIndex + 1} / ${busConfig.sequence.length}`;

            if (currStation) {
                displayLabel.innerText = "이번정류소";
                setStationText(currStation.name);
            }

            updateStandaloneAppRoute(currentIndex);

            // 💡 정류장이 바뀔 때마다 iframe으로 데이터 전송
            sendStationToIframe();
        }
    </script>
</body>
</html>
