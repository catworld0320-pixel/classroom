<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBUS 시내버스 TV 안내판</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
        }

        .gbus-tv-container {
            width: 100%;
            height: 100%;
            background-color: #f3eff5;
            border: 8px solid #282828;
            border-radius: 12px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2), 0 8px 20px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px 20px;
            position: relative;
            overflow: hidden;
        }

        .station-row {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .arrow-down {
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 12px solid #bbb5c0;
            margin: 6px 0;
        }

        /* 1. 이전 정류장 */
        .prev-station {
            font-size: 38px;
            font-weight: 700;
            color: #333333;
            letter-spacing: -1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 95%;
        }

        /* 2. 이번 정류장 (버건디 메인 박스 고정) */
        .curr-station-box {
            width: 100%;
            background-color: #6b1d2f;
            color: #ffffff;
            padding: 22px 15px;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .curr-station-text {
            font-size: 44px;
            font-weight: 900;
            letter-spacing: -1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 98%;
        }

        /* 3. 다음 정류장 */
        .next-station {
            font-size: 38px;
            font-weight: 700;
            color: #333333;
            letter-spacing: -1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 95%;
        }
    </style>
</head>
<body>

    <div class="gbus-tv-container">
        <!-- 1. 이전 정류장 -->
        <div class="station-row">
            <div class="prev-station" id="prevStationText">기점 (첫 정류장)</div>
            <div class="arrow-down"></div>
        </div>

        <!-- 2. 이번 정류장 -->
        <div class="curr-station-box">
            <div class="curr-station-text" id="currStationText">불러오는 중...</div>
        </div>

        <!-- 3. 다음 정류장 -->
        <div class="station-row">
            <div class="arrow-down"></div>
            <div class="next-station" id="nextStationText">종점 (마지막 정류장)</div>
        </div>
    </div>

    <script>
        const prevStationText = document.getElementById('prevStationText');
        const currStationText = document.getElementById('currStationText');
        const nextStationText = document.getElementById('nextStationText');

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'UPDATE_GBUS_STATION') {
                const data = event.data;
                if (data.prevName) prevStationText.innerText = data.prevName;
                if (data.currName) currStationText.innerText = data.currName;
                if (data.nextName) nextStationText.innerText = data.nextName;
            }
        });

        window.onload = () => {
            if (window.parent) {
                window.parent.postMessage({ type: 'REQUEST_TV_INIT' }, '*');
            }
        };
    </script>
</body>
</html>
