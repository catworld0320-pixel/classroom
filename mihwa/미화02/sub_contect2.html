<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4:1 시내버스 LED 안내전광판</title>
    <!-- 둥근모꼴 웹폰트 -->
    <link href="https://hangeul.pstatic.net/hangeul_font/css/dunggeunmo.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: 'DungGeunMo', monospace;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 4:1 비율 가변 컨테이너 */
        .led-4to1-container {
            width: 100%;
            height: 100%;
            background-color: #050505;
            border: 4px solid #222222;
            border-radius: 6px;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
            position: relative;
            
        }

        /* 이번정류소 라벨 (84px 고정) */
        .led-label {
            font-size: 72px;
            color: #00ffaa;
            text-shadow: 0 0 12px rgba(0, 255, 170, 0.8);
            line-height: 1;
            letter-spacing: -5px;
            white-space: nowrap;
        }

        /* 정류장명 디스플레이 영역 */
        .station-wrapper {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .station-wrapper.scrolling-active {
            justify-content: flex-start;
        }

        /* 정류장 이름 (84px 고정) */
        .station-text {
            font-size: 84px;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
            line-height: 1;
            display: inline-block;
        }

        .station-text.scrolling {
            position: absolute;
            left: 0;
        }

        @keyframes slideToRightEnd {
            0% { transform: translateX(0); }
            100% { transform: translateX(var(--scroll-end, -100px)); }
        }
    </style>
</head>
<body>

    <div class="led-4to1-container">
        <!-- 이번정류소 라벨 (84px) -->
        <div class="led-label" id="ledLabel">이번정류소</div>

        <!-- 정류장명 (84px) -->
        <div class="station-wrapper" id="stationWrapper">
            <div class="station-text" id="stationText">준비중</div>
        </div>
    </div>

    <script>
        const ledLabel = document.getElementById('ledLabel');
        const stationText = document.getElementById('stationText');
        const stationWrapper = document.getElementById('stationWrapper');

        function setStationText(text) {
            stationText.innerText = text;
            stationText.style.animation = 'none';
            stationText.offsetHeight; // Reflow

            setTimeout(() => {
                const textWidth = stationText.offsetWidth;
                const containerWidth = stationWrapper.offsetWidth;
                const distance = containerWidth - textWidth;

                if (distance < 0) {
                    stationWrapper.classList.add('scrolling-active');
                    stationText.classList.add('scrolling');

                    const speed = 75; 
                    const duration = Math.abs(distance) / speed; 
                    stationText.style.animation = `slideToRightEnd ${duration}s linear forwards`;
                    stationText.style.setProperty('--scroll-end', `${distance}px`);
                } else {
                    stationWrapper.classList.remove('scrolling-active');
                    stationText.classList.remove('scrolling');
                }
            }, 20);
        }

        // 부모 메인 창에서 수신
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'UPDATE_LED2') {
                if (event.data.label) ledLabel.innerText = event.data.label;
                if (event.data.stationName) setStationText(event.data.stationName);
            }
        });
    </script>
</body>
</html>
